# dnsmasq設定ファイル

# ポート設定（デフォルト: 53）
port=53

no-hosts

addn-hosts=/etc/dnsmasq.d/hosts

# ログ設定
log-queries
log-facility=/var/log/dnsmasq.log

expand-hosts
bogus-priv

# ドメイン設定
domain=lan
domain-needed

# 上位DNSの設定ファイル。
# resolv-file=/etc/dnsmasq_resolv.conf
# 上流DNSサーバー（学校内のネットワークDNS）
# server=10.72.1.11
# server=10.72.1.13
# server=10.64.8.1

# ==========================================
# カスタムDNSレコード
# ==========================================

# Aレコード（ホスト名→IPアドレス）の例
# address=/example.local/10.64.10.106
# address=/www.example.local/10.64.10.106

# CNAMEレコード（エイリアス）の例
# cname=alias.local,real-host.local

# ワイルドカードの例
# address=/.test.local/10.64.10.106

# PTRレコード（逆引き：IPアドレス→ホスト名）の例
# ptr-record=106.10.64.10.in-addr.arpa,www.kosuke.com

# ==========================================

