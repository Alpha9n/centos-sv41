[global]
    workgroup = WORKGROUP
    security = user
    map to guest = Bad User

[Share]
    path = /var/samba/share
    browsable = yes
    writable = yes
    guest ok = yes
    read only = no

[Private]
    path = /var/samba/private
    valid users = @private
    guest ok = no
    writable = yes
    browsable = yes