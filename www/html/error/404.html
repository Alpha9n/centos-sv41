<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - ページが見つかりません | SV41</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        
        /* アニメーション背景 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .shape:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 120px; height: 120px; left: 20%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 60px; height: 60px; left: 80%; animation-delay: 4s; }
        .shape:nth-child(4) { width: 100px; height: 100px; left: 70%; animation-delay: 1s; }
        .shape:nth-child(5) { width: 140px; height: 140px; left: 60%; animation-delay: 3s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .error-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .glitch {
            position: relative;
            animation: glitch 2s linear infinite;
        }
        
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
        
        .btn-glow {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
            transform: translateY(-2px);
        }
        
        .icon-bounce {
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translate3d(0, 0, 0); }
            40%, 43% { transform: translate3d(0, -15px, 0); }
            70% { transform: translate3d(0, -8px, 0); }
            90% { transform: translate3d(0, -3px, 0); }
        }
        
        .text-glow {
            text-shadow: 0 0 20px rgba(118, 75, 162, 0.3);
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .error-code { font-size: 4rem; }
            .error-container { margin: 1rem; }
        }
    </style>
</head>
<body>
    <!-- アニメーション背景 -->
    <div class="bg-animation">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
    </div>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="error-container p-5 text-center">
                    <!-- エラーコード -->
                    <div class="error-code glitch mb-4">404</div>
                    
                    <!-- アイコン -->
                    <div class="mb-4">
                        <i class="fas fa-search icon-bounce text-muted" style="font-size: 4rem;"></i>
                    </div>
                    
                    <!-- メインメッセージ -->
                    <h1 class="display-4 fw-bold text-glow mb-4">
                        <span class="text-primary">おっと！</span>
                        <span class="text-secondary">迷子になっちゃった？</span>
                    </h1>
                    
                    <!-- サブメッセージ -->
                    <p class="lead text-muted mb-4">
                        お探しのページは見つかりませんでした。
                    </p>
                    
                    <!-- 詳細情報 -->
                    <div class="alert alert-light border-0 mb-4" role="alert">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <i class="fas fa-exclamation-triangle text-warning me-2"></i>
                                <strong>エラーコード:</strong> 404
                            </div>
                            <div class="col-md-4">
                                <i class="fas fa-clock text-info me-2"></i>
                                <strong>発生時刻:</strong> <span id="currentTime"></span>
                            </div>
                            <div class="col-md-4">
                                <i class="fas fa-server text-success me-2"></i>
                                <strong>サーバー:</strong> SV41-Apache
                            </div>
                        </div>
                    </div>
                    
                    <!-- アクションボタン -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center mb-4">
                        <button onclick="history.back()" class="btn btn-outline-primary btn-lg btn-glow me-md-2">
                            <i class="fas fa-arrow-left me-2"></i>前のページに戻る
                        </button>
                        <a href="/" class="btn btn-primary btn-lg btn-glow">
                            <i class="fas fa-home me-2"></i>ホームに戻る
                        </a>
                    </div>
                    
                    <!-- ヘルプセクション -->
                    <div class="row g-3 mt-4">
                        <div class="col-md-4">
                            <div class="card border-0 bg-light h-100">
                                <div class="card-body text-center">
                                    <i class="fas fa-question-circle text-primary mb-3" style="font-size: 2rem;"></i>
                                    <h6 class="card-title">ヘルプが必要？</h6>
                                    <p class="card-text small">困ったときはサポートチームにお気軽にお問い合わせください。</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card border-0 bg-light h-100">
                                <div class="card-body text-center">
                                    <i class="fas fa-sitemap text-success mb-3" style="font-size: 2rem;"></i>
                                    <h6 class="card-title">サイトマップ</h6>
                                    <p class="card-text small">全体の構造を確認して、お探しのコンテンツを見つけましょう。</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card border-0 bg-light h-100">
                                <div class="card-body text-center">
                                    <i class="fas fa-bug text-warning mb-3" style="font-size: 2rem;"></i>
                                    <h6 class="card-title">不具合報告</h6>
                                    <p class="card-text small">リンク切れを発見された場合は、管理者までご報告ください。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- フッター -->
                    <hr class="my-4">
                    <div class="text-muted small">
                        <p class="mb-0">
                            <i class="fas fa-shield-alt me-1"></i>
                            Powered by <strong>SV41 CentOS Server</strong> | 
                            <i class="fas fa-code me-1"></i>
                            神保恒介の実習環境
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 現在時刻を表示
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('currentTime').textContent = timeString;
        }
        
        // 1秒ごとに時刻を更新
        updateTime();
        setInterval(updateTime, 1000);
        
        // ページロード時のアニメーション
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.error-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.8s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
        
        // コンソールに隠しメッセージ
        console.log(`
        🎉 おめでとう！開発者ツールを開いたね！
        
        ┌─────────────────────────────────────┐
        │  404エラーページを見つけたあなたは   │
        │  真の探検家です！🕵️‍♂️                │
        │                                     │
        │  このページは神保恒介によって        │
        │  愛をこめて作られました ❤️           │
        └─────────────────────────────────────┘
        `);
    </script>
</body>
</html>
