<Directory "/var/www/html/secret">
    AllowOverride None
    AuthType Basic
    AuthName "Secret Area"
    AuthUserFile /etc/httpd/conf/.htpasswd
    Require user cent
    # HTTPS 強制（自己署名だが一応）
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTPS} !=on
        RewriteRule ^.*$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    </IfModule>
</Directory>